name: dependency-security-automerge

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      recover_pr:
        description: 'Merged bot PR number: retry exact-main CI dispatch only (no merge)'
        required: false
        type: string
      probe_permissions:
        description: 'Probe viewer-enforced protection and alert reads with merging disabled'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: dependency-security-automerge
  cancel-in-progress: false

jobs:
  policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # exact-head normal PR merge, still enforced by server protection
      pull-requests: write # merge qualifying PRs and revoke legacy auto-merge grants; no approval
      checks: read
      actions: write # explicit ci workflow_dispatch; token-created push is suppressed
      vulnerability-alerts: read # Dependabot alerts; fail closed on unsupported hosts
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Only protected main policy runs. PR blobs are API data, never checked out,
      # installed, imported or evaluated. No PR title/body/shell interpolation.
      - name: Evaluate security patch policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCY_SECURITY_AUTOMERGE: ${{ vars.DEPENDENCY_SECURITY_AUTOMERGE }}
          RECOVER_PR: ${{ inputs.recover_pr }}
          PROBE_PERMISSIONS: ${{ inputs.probe_permissions }}
        run: node tools/dependency-update-policy-run.mjs
