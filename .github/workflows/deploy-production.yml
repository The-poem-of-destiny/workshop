name: deploy-production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    environment: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate successful staging deploy for this commit
        id: staging
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow deploy-staging.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::no successful staging deploy for $GITHUB_SHA"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: staging-web-${{ github.sha }}
          run-id: ${{ steps.staging.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify promoted artifact hash
        run: sha256sum -c artifact.sha256
      - name: Verify tag checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply production migrations
        run: pnpm --filter @workshop/worker exec wrangler d1 migrations apply workshop-prod --remote --config wrangler.jsonc --env production
      - name: Deploy production worker
        run: pnpm --filter @workshop/worker exec wrangler deploy --config wrangler.jsonc --env production
      - name: Record worker version
        run: pnpm --filter @workshop/worker exec wrangler deployments list --config wrangler.jsonc --env production | tee deployment.txt
      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/api/v1/health" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
