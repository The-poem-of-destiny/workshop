name: deploy-production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run: ${{ steps.staging.outputs.run }}
      attempt: ${{ steps.staging.outputs.attempt }}
      release: ${{ steps.staging.outputs.release }}
      evidence: ${{ steps.staging.outputs.evidence }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged revision belongs to main
        id: source
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Locate accepted staging artifact
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 .github/scripts/select-staging-artifact.py "$RELEASE_SHA"

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      STAGING_RUN: ${{ needs.validate.outputs.run }}
      STAGING_ATTEMPT: ${{ needs.validate.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.run }}
          artifact-ids: ${{ needs.validate.outputs.release }}
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.run }}
          artifact-ids: ${{ needs.validate.outputs.evidence }}
      - name: Verify exact tested artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          sha256sum -c artifact.sha256
          jq -e --arg sha "$RELEASE_SHA" --arg run "$STAGING_RUN" --arg attempt "$STAGING_ATTEMPT" \
            --arg hash "$(sha256sum artifact.sha256 | cut -d' ' -f1)" \
            --arg client "$(sha256sum apps/tavern-client/dist/index.js | cut -d' ' -f1)" \
            --slurpfile build artifact-manifest.json '
              .sourceSha == $sha and .workflowRunId == $run and .deploymentAttempt == $attempt
              and .artifactHash == $hash and .clientSha256 == $client and .smoke == "passed"
              and (.workerVersionId | type == "string" and length > 0)
              and $build == [del(.deploymentAttempt, .workerVersionId, .clientSha256, .smoke)]
            ' staging-acceptance.json
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production configuration
        working-directory: apps/worker
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing dedicated production CLOUDFLARE_API_TOKEN.'; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::Invalid production CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
          node --input-type=module <<'JS'
          import { unstable_readConfig } from 'wrangler';
          const config = unstable_readConfig({ config: 'wrangler.jsonc', env: 'production' });
          const origin = new URL(process.env.PRODUCTION_URL);
          if (origin.protocol !== 'https:' || origin.href !== `${origin.origin}/` ||
              config.vars.PUBLIC_ORIGIN !== origin.origin ||
              !String(config.vars.ALLOWED_ORIGINS).split(',').map(value => value.trim()).includes(origin.origin) ||
              !config.vars.DISCORD_CLIENT_ID || !config.vars.DISCORD_ALLOWED_GUILD_IDS) {
            throw new Error('Verify the production origin and configure Discord application and guilds before releasing.');
          }
          JS
          pnpm exec wrangler secret list --format json --config wrangler.jsonc --env production | jq -e '
            map(.name) as $names | ["DISCORD_CLIENT_SECRET", "SESSION_HASH_SECRET", "MAINTENANCE_TOKEN"] - $names == []
          ' >/dev/null || { echo '::error::Production runtime secret names could not be verified.'; exit 1; }
      - name: Verify live production schema
        run: python3 .github/scripts/verify-release-schema.py production
      - name: Capture current production recovery point
        run: |
          set -euo pipefail
          bookmark="$(pnpm --filter @workshop/worker exec wrangler d1 time-travel info DB --json --config wrangler.jsonc --env production | jq -er '.bookmark | select(type == "string" and length > 0)')"
          pnpm --filter @workshop/worker exec wrangler deployments status --json --config wrangler.jsonc --env production > previous-deployment.json
          jq -e '.versions | length > 0' previous-deployment.json >/dev/null
          pnpm --filter @workshop/worker exec wrangler d1 execute DB --remote --json --config wrangler.jsonc --env production \
            --command "SELECT value FROM site_settings WHERE key = 'client_channels'" > previous-client.json
          jq -e 'length == 1 and .[0].success == true' previous-client.json >/dev/null
          jq -n --arg bookmark "$bookmark" --arg sha "$RELEASE_SHA" --arg tag "$GITHUB_REF_NAME" \
            --slurpfile worker previous-deployment.json --slurpfile client previous-client.json \
            '{bookmark:$bookmark, sourceSha:$sha, tag:$tag, worker:$worker[0], client:$client[0][0].results}' > production-recovery.json
      - uses: actions/upload-artifact@v7
        with:
          name: production-recovery-${{ github.run_attempt }}
          path: production-recovery.json
          if-no-files-found: error
          retention-days: 90
      - name: Deploy production Worker
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-wrangler.jsonl
        run: pnpm --filter @workshop/worker exec wrangler deploy build/index.js --no-bundle --config wrangler.jsonc --env production
      - name: Publish stable client
        run: pnpm --filter @workshop/tavern-client publish:client --env production --channel stable --allow-production
      - name: Smoke test production
        run: bash .github/scripts/smoke-release.sh "$PRODUCTION_URL" stable
      - name: Record production acceptance
        run: |
          set -euo pipefail
          version="$(jq -ers '
            [.[] | select(.type == "deploy" and .wrangler_environment == "production") | .version_id]
            | select(length == 1) | .[0] | select(type == "string" and length > 0)
          ' "$RUNNER_TEMP/production-wrangler.jsonl")"
          pnpm --filter @workshop/worker exec wrangler deployments status --json --config wrangler.jsonc --env production \
            | jq -e --arg version "$version" '.versions | length == 1 and .[0].version_id == $version and .[0].percentage == 100'
          jq --arg version "$version" --arg tag "$GITHUB_REF_NAME" \
            '. + {productionWorkerVersionId: $version, tag: $tag}' staging-acceptance.json > production-acceptance.json
      - uses: actions/upload-artifact@v7
        with:
          name: production-acceptance-${{ github.run_attempt }}
          path: production-acceptance.json
          if-no-files-found: error
          retention-days: 90
