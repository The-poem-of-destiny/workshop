name: deploy-staging

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FORCE_RELEASE: ${{ github.event.workflow_run.event == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect deployable changes and freshness
        id: filter
        run: python3 .github/scripts/staging-release-gate.py

  build:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify CI source
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Web assets
        run: pnpm --filter @workshop/worker web:build
      - name: Build Worker bundle
        run: pnpm --filter @workshop/worker exec wrangler deploy --dry-run --outdir build --config wrangler.jsonc --env staging
      - name: Build Tavern client
        run: pnpm --filter @workshop/tavern-client build
      - name: Assemble release artifact
        run: |
          set -euo pipefail
          find apps/worker/web/dist apps/worker/build apps/tavern-client/dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact.sha256
          cat artifact.sha256
          mkdir -p release/apps/worker/web release/apps/tavern-client
          cp -R apps/worker/build release/apps/worker/build
          cp -R apps/worker/web/dist release/apps/worker/web/dist
          cp -R apps/tavern-client/dist release/apps/tavern-client/dist
          cp artifact.sha256 release/artifact.sha256
      - name: Record provenance
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$HEAD_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactHash "$(sha256sum artifact.sha256 | cut -d' ' -f1)" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sourceSha:$sourceSha,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,artifactHash:$artifactHash,createdAt:$createdAt}' \
            > artifact-manifest.json
          cp artifact-manifest.json release/artifact-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: |
            release/apps/worker/build
            release/apps/worker/web/dist
            release/apps/tavern-client/dist
            release/artifact.sha256
            release/artifact-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy:
    # This successful job, not workflow_run.head_sha on this workflow's run, records the deployed source.
    name: deploy ${{ github.event.workflow_run.head_sha }}
    needs: build
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
      - name: Verify artifact
        run: |
          set -euo pipefail
          sha256sum -c artifact.sha256
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          jq -e --arg sha "$HEAD_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg hash "$(sha256sum artifact.sha256 | cut -d' ' -f1)" \
            '.sourceSha == $sha and .workflowRunId == $run and .artifactHash == $hash' artifact-manifest.json
      - name: Check release configuration and freshness
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::main moved to $current; skipping stale $HEAD_SHA before any staging changes."
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing dedicated staging CLOUDFLARE_API_TOKEN.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing staging CLOUDFLARE_ACCOUNT_ID.'; exit 1; }
          [[ "$STAGING_URL" == https://?* ]] || { echo '::error::Missing or invalid HTTPS STAGING_URL.'; exit 1; }
          # Runtime secrets are provisioned and checked by the operator out of band.
          # A release neither verifies their presence nor configures or rotates them.
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
      - name: Verify live staging schema
        if: steps.ready.outputs.fresh == 'true'
        run: python3 .github/scripts/verify-release-schema.py staging
      - name: Deploy staging worker
        if: steps.ready.outputs.fresh == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/staging-wrangler.jsonl
        run: pnpm --filter @workshop/worker exec wrangler deploy build/index.js --no-bundle --config wrangler.jsonc --env staging
      - name: Publish staging client
        if: steps.ready.outputs.fresh == 'true'
        run: pnpm --filter @workshop/tavern-client publish:client --env staging --channel staging
      - name: Smoke test
        if: steps.ready.outputs.fresh == 'true'
        run: bash .github/scripts/smoke-release.sh "$STAGING_URL" staging
      - name: Confirm no staging mutation
        if: steps.ready.outputs.fresh == 'false'
        run: echo 'Stale CI source; no staging release was performed.'
      - name: Record staging acceptance
        if: steps.ready.outputs.fresh == 'true'
        run: |
          set -euo pipefail
          version="$(jq -ers '
            [.[] | select(.type == "deploy" and .wrangler_environment == "staging") | .version_id]
            | select(length == 1) | .[0] | select(type == "string" and length > 0)
          ' "$RUNNER_TEMP/staging-wrangler.jsonl")"
          pnpm --filter @workshop/worker exec wrangler deployments status --json --config wrangler.jsonc --env staging > "$RUNNER_TEMP/staging-deployment.json"
          jq -e --arg version "$version" '
            .versions | length == 1 and .[0].version_id == $version and .[0].percentage == 100
          ' "$RUNNER_TEMP/staging-deployment.json"
          jq --arg version "$version" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg clientSha "$(sha256sum apps/tavern-client/dist/index.js | cut -d' ' -f1)" \
            '. + {deploymentAttempt: $attempt, workerVersionId: $version, clientSha256: $clientSha, smoke: "passed"}' \
            artifact-manifest.json > staging-acceptance.json
      - name: Upload staging acceptance evidence
        if: steps.ready.outputs.fresh == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staging-evidence-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          path: staging-acceptance.json
          if-no-files-found: error
          retention-days: 90
