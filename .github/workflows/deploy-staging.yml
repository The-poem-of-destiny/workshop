name: deploy-staging

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workshop/worker web:build
      - name: Record artifact hash
        run: |
          set -euo pipefail
          find apps/worker/web/dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact.sha256
          cat artifact.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: staging-web-${{ github.sha }}
          path: |
            apps/worker/web/dist
            artifact.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    environment: staging
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: staging-web-${{ github.sha }}
      - name: Verify downloaded artifact hash
        run: sha256sum -c artifact.sha256
      - name: Apply staging migrations
        run: pnpm --filter @workshop/worker exec wrangler d1 migrations apply workshop-staging --remote --config wrangler.jsonc --env staging
      - name: Deploy staging worker
        run: pnpm --filter @workshop/worker exec wrangler deploy --config wrangler.jsonc --env staging
      - name: Record worker version
        run: pnpm --filter @workshop/worker exec wrangler deployments list --config wrangler.jsonc --env staging | tee deployment.txt
      - name: Smoke test
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.STAGING_URL }}/api/v1/health" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
