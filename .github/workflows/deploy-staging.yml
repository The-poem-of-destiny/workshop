name: deploy-staging

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Detect deployable changes and freshness
        id: filter
        run: |
          set -euo pipefail
          current="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::main moved to $current; skipping stale $HEAD_SHA"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last="$(gh run list --workflow deploy-staging.yml --status success --limit 1 --json headSha --jq '.[0].headSha // empty')"
          if [ -z "$last" ]; then
            base="$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" --jq '.parents[0].sha')"
          else
            base="$last"
          fi

          if [ "$base" = "$HEAD_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${{ github.repository }}/compare/${base}...${HEAD_SHA}" --jq '.files[]? | .filename, .previous_filename // empty')"
          if printf '%s\n' "$files" | grep -Eq '^(apps/worker/|apps/tavern-client/|packages/|tools/|tests/|pnpm-workspace.yaml|pnpm-lock.yaml|package.json)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Web assets
        run: pnpm --filter @workshop/worker web:build
      - name: Build Worker bundle
        run: pnpm --filter @workshop/worker exec wrangler deploy --dry-run --outdir build --config wrangler.jsonc --env staging
      - name: Build Tavern client
        run: pnpm --filter @workshop/tavern-client build
      - name: Assemble release artifact
        run: |
          set -euo pipefail
          find apps/worker/web/dist apps/worker/build apps/tavern-client/dist -type f -print0 | sort -z | xargs -0 sha256sum > artifact.sha256
          cat artifact.sha256
          mkdir -p release/apps/worker/web release/apps/tavern-client
          cp -R apps/worker/build release/apps/worker/build
          cp -R apps/worker/web/dist release/apps/worker/web/dist
          cp -R apps/tavern-client/dist release/apps/tavern-client/dist
          cp artifact.sha256 release/artifact.sha256
      - name: Record provenance
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceSha "$HEAD_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactHash "$(sha256sum artifact.sha256 | cut -d' ' -f1)" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{sourceSha:$sourceSha,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,artifactHash:$artifactHash,createdAt:$createdAt}' \
            > artifact-manifest.json
          cp artifact-manifest.json release/artifact-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: |
            release/apps/worker/build
            release/apps/worker/web/dist
            release/apps/tavern-client/dist
            release/artifact.sha256
            release/artifact-manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  deploy:
    needs: build
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
      - name: Verify artifact
        run: |
          set -euo pipefail
          sha256sum -c artifact.sha256
          jq -e --arg sha "$HEAD_SHA" '.sourceSha == $sha' artifact-manifest.json
      - name: Apply staging migrations
        run: pnpm --filter @workshop/worker exec wrangler d1 migrations apply workshop-staging --remote --config wrangler.jsonc --env staging
      - name: Deploy staging worker
        run: pnpm --filter @workshop/worker exec wrangler deploy build/index.js --no-bundle --config wrangler.jsonc --env staging
      - name: Publish staging client
        run: pnpm --filter @workshop/tavern-client publish:client --env staging --channel staging
      - name: Record worker version
        run: pnpm --filter @workshop/worker exec wrangler deployments list --config wrangler.jsonc --env staging | tee deployment.txt
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: staging-evidence-${{ github.event.workflow_run.head_sha }}
          path: |
            artifact-manifest.json
            deployment.txt
          retention-days: 90
      - name: Smoke test
        run: |
          set -euo pipefail
          base="${{ vars.STAGING_URL }}"
          probe="$RUNNER_TEMP/smoke"
          mkdir -p "$probe"
          # Download first, then assert: piping curl into `grep -q` lets grep exit
          # early, which surfaces as curl (23) under `pipefail`.
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$base/api/v1/health" -o "$probe/health.json"; then break; fi
            if [ "$i" = 5 ]; then exit 1; fi
            sleep 5
          done
          grep -q '"ok":true' "$probe/health.json"
          curl -fsS --max-time 20 "$base/api/v1/projects" -o "$probe/projects.json"
          grep -q '"items"' "$probe/projects.json"
          curl -fsS --max-time 20 "$base/" -o "$probe/index.html"
          grep -q 'id="root"' "$probe/index.html"
          curl -fsS --max-time 20 "$base/client/staging/index.js" -o "$probe/client.js"
          grep -q 'CreativeWorkshop' "$probe/client.js"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/v1/me")" = "401"
