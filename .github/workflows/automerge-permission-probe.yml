name: automerge-permission-probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  vulnerability-alerts: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/automerge-permission-probe.mjs
        env:
          GH_TOKEN: ${{ github.token }}
