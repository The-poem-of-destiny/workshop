name: verify-production-backup

on:
  workflow_dispatch:
    inputs:
      object_key:
        description: R2 object key, for example d1/20261021T120000Z/workshop-prod.sql
        required: true
        type: string
      sha256:
        description: Optional expected SHA-256 of the downloaded SQL file
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verify-production-backup
  cancel-in-progress: false

jobs:
  verify:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download backup
        run: |
          set -euo pipefail
          test -n "$BACKUP_BUCKET"
          mkdir -p "$GITHUB_WORKSPACE/backup"
          pnpm --filter @workshop/worker exec wrangler r2 object get \
            "${BACKUP_BUCKET}/${{ inputs.object_key }}" \
            --file "$GITHUB_WORKSPACE/backup/workshop-prod.sql" --remote --config wrangler.jsonc --env production
          test -s "$GITHUB_WORKSPACE/backup/workshop-prod.sql"
      - name: Verify hash
        if: inputs.sha256 != ''
        run: |
          set -euo pipefail
          echo "${{ inputs.sha256 }}  $GITHUB_WORKSPACE/backup/workshop-prod.sql" | sha256sum -c -
      - name: Verify SQL integrity
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sqlite3
          db="$GITHUB_WORKSPACE/backup/workshop-prod.sqlite"
          rm -f "$db"
          sqlite3 "$db" < "$GITHUB_WORKSPACE/backup/workshop-prod.sql"
          integrity="$(sqlite3 "$db" "PRAGMA integrity_check;")"
          echo "integrity=$integrity"
          test "$integrity" = "ok"
          tables="$(sqlite3 "$db" "SELECT count(*) FROM sqlite_master WHERE type='table';")"
          echo "tables=$tables"
          if [ "$tables" -eq 0 ]; then
            echo "::warning::backup contains no tables (empty database)"
          fi
      - name: Record verification
        run: |
          set -euo pipefail
          {
            echo "object_key=${{ inputs.object_key }}"
            echo "sha256=$(sha256sum "$GITHUB_WORKSPACE/backup/workshop-prod.sql" | cut -d' ' -f1)"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee verification.txt
      - uses: actions/upload-artifact@v7
        with:
          name: backup-verification
          path: verification.txt
          retention-days: 90
